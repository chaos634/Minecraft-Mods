              p net.minecraft.client.renderer.entity.state.ArmedEntityRenderState
              p net.minecraft.client.renderer.entity.state.HoldingEntityRenderState
              p net.minecraft.client.renderer.entity.state.LivingEntityRenderState 'Item|item'
              p net.minecraft.world.level.block.Blocks 'TORCH|WALL_TORCH'
              p net.minecraft.world.level.block.state.BlockBehaviour\$BlockStateBase 'canSurvive|canBeReplaced|isFaceSturdy|getLightEmission|getFluidState|isSolid|blocksMotion|getDestroySpeed'
              p net.minecraft.world.level.material.FluidState ' is\(|isEmpty|isSource'
              p net.minecraft.tags.FluidTags 'LAVA|WATER'
              p net.minecraft.world.item.Items 'TORCH|BREAD|COOKED_BEEF|BAKED_POTATO|NAME_TAG|BELL|GOAT_HORN|BLAZE_ROD|STICK$'
              p net.minecraft.world.entity.player.Inventory 'getSelected|getContainerSize|getItem\(|removeItem|findSlotMatchingItem|contains|getNonEquipmentItems'
              p net.minecraft.world.item.CreativeModeTab 'builder|Output|displayItems|icon|title|TabVisibility'
              p net.minecraft.world.level.gamerules.GameRules 'MOB_GRIEFING|get\(|getBoolean'
              p net.minecraft.world.level.block.entity.HopperBlockEntity 'addItem'
              p net.minecraft.world.level.block.JukeboxBlock
