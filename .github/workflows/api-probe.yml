# TEMPORARY: prints Minecraft 26.3 class signatures and JEI/REI versions. Removed again after use.

name: api-probe

on:
  push:
    branches: [claude/fervent-cray-y1lqfh]
    paths: ['.github/workflows/api-probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        group: [x]
    defaults:
      run:
        working-directory: kumpel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: maven versions
        if: matrix.group == 'versions'
        run: |
          for u in \
            https://maven.blamejared.com/mezz/jei/jei-26.3-fabric/maven-metadata.xml \
            https://maven.blamejared.com/mezz/jei/jei-26.3-fabric-api/maven-metadata.xml \
            https://maven.blamejared.com/mezz/jei/jei-26.3-common-api/maven-metadata.xml \
            https://maven.shedaniel.me/me/shedaniel/RoughlyEnoughItems-fabric/maven-metadata.xml \
            https://maven.shedaniel.me/me/shedaniel/RoughlyEnoughItems-api-fabric/maven-metadata.xml \
            https://maven.shedaniel.me/me/shedaniel/RoughlyEnoughItems-default-plugin-fabric/maven-metadata.xml \
            https://maven.architectury.dev/dev/architectury/architectury-fabric/maven-metadata.xml \
            https://maven.shedaniel.me/me/shedaniel/cloth/cloth-config-fabric/maven-metadata.xml \
            https://maven.terraformersmc.com/releases/com/terraformersmc/modmenu/maven-metadata.xml ; do
            echo "##### $u"
            curl -sSL --max-time 30 "$u" | grep -o '<version>[^<]*</version>' | grep -E '26\.|31\.9|22\.|alpha' | tail -12 || true
          done
      - name: resolve classpath
        if: matrix.group != 'versions'
        run: |
          chmod +x ./gradlew
          cat >> build.gradle <<'EOF'
          tasks.register('printClientCp') {
            def cp = sourceSets.client.compileClasspath
            doLast { println "CP=" + cp.asPath }
          }
          EOF
          ./gradlew --no-configuration-cache -q printClientCp | grep '^CP=' | sed 's/^CP=//' > /tmp/cp.txt
      - name: javap
        if: matrix.group != 'versions'
        env:
          GROUP: ${{ matrix.group }}
        run: |
          CP=$(cat /tmp/cp.txt)
          MCJARS=$(tr ':' '\n' < /tmp/cp.txt | grep -E 'minecraft-(common|clientOnly)')
          p() {
            echo "##### $1"
            if [ -n "$2" ]; then javap -cp "$CP" -protected "$1" 2>&1 | grep -E "$2" || true
            else javap -cp "$CP" -protected "$1" 2>&1 || true; fi
          }
          ls_jar() {
            echo "##### jar entries matching $1"
            for j in $MCJARS; do unzip -Z1 "$j" | grep -E "$1" | grep -v '\$' || true; done | sort -u
          }
          case "$GROUP" in
            x)
              ls_jar '/(WaterAvoidingRandomFlyingGoal|BreedGoal|PanicGoal|TemptGoal|LandOnOwnersShoulderGoal|SpawnPlacementTypes|EntityProcessor|ParrotRenderState|ChickenRenderState)\.class'
              p net.minecraft.world.entity.ai.goal.WaterAvoidingRandomFlyingGoal 'public|protected'
              p net.minecraft.world.entity.ai.goal.BreedGoal 'public .*BreedGoal\('
              p net.minecraft.world.entity.ai.goal.PanicGoal 'public .*PanicGoal\('
              p net.minecraft.world.entity.ai.goal.TemptGoal 'public .*TemptGoal\('
              p net.minecraft.world.entity.ai.goal.FollowOwnerGoal 'public|protected'
              p net.minecraft.world.entity.ai.control.FlyingMoveControl
              p net.minecraft.world.inventory.ChestMenu 'ChestMenu\('
              p net.minecraft.world.inventory.DispenserMenu 'DispenserMenu\('
              p net.minecraft.world.entity.SpawnPlacementTypes
              p net.minecraft.world.item.ItemStack 'CODEC|copyAndClear|isSameItemSameComponents|split\(|getMaxStackSize'
              p net.minecraft.nbt.CompoundTag 'CODEC'
              p net.minecraft.network.codec.ByteBufCodecs 'COMPOUND_TAG|STRING_UTF8|VAR_INT|VAR_LONG|fromCodec'
              p net.minecraft.client.renderer.entity.state.LivingEntityRenderState 'public'
              p net.minecraft.client.renderer.entity.state.EntityRenderState 'public [a-z]'
              p net.minecraft.client.renderer.entity.LivingEntityRenderer 'scale|getShadow|MobRenderer|protected|LivingEntityRenderer\('
              p net.minecraft.client.renderer.entity.MobRenderer
              p net.minecraft.client.renderer.entity.ParrotRenderer
              p net.minecraft.client.model.animal.parrot.ParrotModel 'public|static'
              p net.minecraft.world.entity.animal.parrot.Parrot 'flap|Flap|causeFallDamage|checkFallDamage|isFlying|aiStep|getAmbientSound|createNavigation|mobInteract|canMate|isFood|getBreedOffspring|imitate|setVariant'
              p net.minecraft.world.level.block.HorizontalDirectionalBlock
              p net.minecraft.world.level.block.state.BlockBehaviour 'codec|getMenuProvider|affectNeighborsAfterRemoval|useWithoutItem|getShape|onRemove|hasAnalogOutputSignal|getAnalogOutputSignal'
              p net.minecraft.world.level.block.entity.BlockEntity 'preRemoveSideEffects|setChanged|getBlockState'
              p net.minecraft.tags.EntityTypeTags 'FALL_DAMAGE_IMMUNE'
              p net.minecraft.world.entity.TamableAnimal 'public|protected'
              p net.minecraft.world.entity.animal.Animal 'mobInteract|usePlayerItem|canFallInLove|setInLove|isInLove|canMate|spawnChildFromBreeding|isFood'
              p net.minecraft.world.entity.AgeableMob 'getBreedOffspring|isBaby|setAge|getAge|canBeABaby'
              p net.minecraft.world.entity.Mob 'isLeashed|playAmbientSound|getAmbientSound|setPersistenceRequired|removeWhenFarAway|requiresCustomPersistence|getAmbientSoundInterval'
              p net.minecraft.world.entity.Entity 'isPassenger|discard|setCustomName|getCustomName|hasCustomName|getName\(|getDisplayName|level\(\)|setUUID|spawnAtLocation|playSound\('
              p net.minecraft.world.level.Level 'isLoaded|hasChunkAt|addFreshEntity'
              p net.minecraft.server.level.ServerLevel 'addFreshEntity|getEntity\(|sendParticles\(net.minecraft.core.particles.ParticleOptions, double'
              p net.minecraft.server.players.PlayerList 'getPlayer\('
              p net.minecraft.world.entity.player.Player 'displayClientMessage|sendOverlayMessage|sendSystemMessage|getInventory|addItem|isCreative|hasInfiniteMaterials|getAbilities'
              p net.minecraft.world.item.Item 'appendHoverText|useOn|interactLivingEntity|use\('
              p net.minecraft.world.item.component.TooltipDisplay 'public'
              ;;
          esac
