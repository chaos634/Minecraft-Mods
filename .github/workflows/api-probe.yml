            f)
              ls_jar '/(ArmorMaterial|ArmorMaterials|ArmorType|EquipmentAsset|EquipmentAssets|Equippable|LevelChunkSection|PalettedContainer|PalettedContainerRO|EquipmentClientInfo)\.class'
              p net.minecraft.world.item.equipment.ArmorMaterial
