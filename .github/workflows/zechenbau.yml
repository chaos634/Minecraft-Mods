# Builds the Zechenbau mod and runs its game tests on every push and pull request that touches it.
# The finished .jar can be downloaded from the "Artifacts" section of the workflow run.

name: zechenbau

on:
  push:
    paths:
      - 'zechenbau/**'
      - '.github/workflows/zechenbau.yml'
  pull_request:
    paths:
      - 'zechenbau/**'
      - '.github/workflows/zechenbau.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: zechenbau
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build and run server game tests
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zechenbau-mod
          path: zechenbau/build/libs/

  client-game-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: zechenbau
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: install virtual display and software renderer
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-vulkan-drivers python3-pil
      - name: run client game tests
        run: |
          chmod +x ./gradlew
          xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +render -noreset" \
            timeout 900 ./gradlew runClientGameTest --stacktrace
      # TEMPORARY: prints the screenshots so they can be put into the README. Removed again after use.
      - name: print screenshots
        if: always()
        run: |
          python3 - <<'EOF'
          import base64, glob, io
          from PIL import Image
          for path in sorted(glob.glob('**/screenshots/*.png', recursive=True)):
              buffer = io.BytesIO()
              Image.open(path).convert('RGB').save(buffer, 'JPEG', quality=85)
              data = base64.b64encode(buffer.getvalue()).decode()
              print('=====BEGIN', path)
              for i in range(0, len(data), 120):
                  print(data[i:i + 120])
              print('=====END', path)
          EOF
      - name: upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-game-test-screenshots
          path: zechenbau/**/screenshots/
