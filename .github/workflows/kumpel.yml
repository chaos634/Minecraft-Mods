# Builds the Kumpel mod on every push and pull request that touches it.
# The finished .jar can be downloaded from the "Artifacts" section of the workflow run.

name: kumpel

on:
  push:
    paths:
      - 'kumpel/**'
      - '.github/workflows/kumpel.yml'
  pull_request:
    paths:
      - 'kumpel/**'
      - '.github/workflows/kumpel.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: kumpel
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kumpel-mod
          path: kumpel/build/libs/
