# Builds the Kumpel mod and runs its game tests on every push and pull request that touches it.
# The finished .jar can be downloaded from the "Artifacts" section of the workflow run.

name: kumpel

on:
  push:
    paths:
      - 'kumpel/**'
      - '.github/workflows/kumpel.yml'
  pull_request:
    paths:
      - 'kumpel/**'
      - '.github/workflows/kumpel.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: kumpel
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build and run server game tests
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kumpel-mod
          path: kumpel/build/libs/

  client-game-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kumpel
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: install virtual display and software renderer
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-vulkan-drivers
      - name: run client game tests
        run: |
          chmod +x ./gradlew
          xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +render -noreset" \
            timeout 900 ./gradlew runClientGameTest --stacktrace
      - name: upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-game-test-screenshots
          path: kumpel/**/screenshots/
