plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"kumpel" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Server game tests run as part of `build`; client game tests (with screenshots) via `runClientGameTest`.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "kumpel-gametest"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

// CI runs Gradle inside its own virtual display (see .github/workflows/kumpel.yml), so Loom must not start another.
tasks.withType(net.fabricmc.loom.task.AbstractRunTask).configureEach {
	useXvfb = false
}

repositories {
	maven {
		name = "BlameJared (JEI)"
		url = "https://maven.blamejared.com/"
		content {
			includeGroup "mezz.jei"
			includeGroupByRegex "net\\.mezzdev.*"
		}
	}
	maven {
		name = "shedaniel (REI)"
		url = "https://maven.shedaniel.me/"
		content { includeGroupByRegex "me\\.shedaniel.*" }
	}
	maven {
		name = "Architectury"
		url = "https://maven.architectury.dev/"
		content { includeGroup "dev.architectury" }
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// JEI and REI integration: only their APIs are needed to compile; JEI also runs in dev so the plugin gets exercised.
	compileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
	compileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
	runtimeOnly "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"
	compileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}") {
		exclude group: "net.fabricmc"
		exclude group: "net.fabricmc.fabric-api"
	}
	compileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${project.rei_version}") {
		exclude group: "net.fabricmc"
		exclude group: "net.fabricmc.fabric-api"
	}
	// Types used in REI's API signatures (math helpers from Cloth Config, FluidStack from Architectury).
	compileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") { transitive = false }
	compileOnly("dev.architectury:architectury-fabric:${project.architectury_version}") { transitive = false }
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
	it.options.compilerArgs.add("-Xlint:deprecation")
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
