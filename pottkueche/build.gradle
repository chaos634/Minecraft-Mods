plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"pottkueche" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Server game tests run as part of `build`; client game tests (with screenshots) via `runClientGameTest`.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "pottkueche-gametest"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

// CI runs Gradle inside its own virtual display (see .github/workflows/pottkueche.yml), so Loom must not start another.
tasks.withType(net.fabricmc.loom.task.AbstractRunTask).configureEach {
	useXvfb = false
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
	it.options.compilerArgs.add("-Xlint:deprecation")
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
